name: strangler-fig

x-app: &app
  restart: unless-stopped
  read_only: true
  user: "1654:1654"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  mem_limit: 384m
  cpus: 0.75
  environment: &app-environment
    ASPNETCORE_ENVIRONMENT: Local
    ASPNETCORE_HTTP_PORTS: "8080"
    Telemetry__Endpoint: http://openobserve:5080/api/default/v1/logs
    Telemetry__Username: default
    Telemetry__PasswordFile: /run/secrets/openobserve_password

services:
  runtime-init:
    image: strangler-fig-postgres:local
    build:
      context: .
      dockerfile: infrastructure/postgres.Dockerfile
    # Files backed by Compose secrets do not remap host ownership; this one-shot copies them to restricted runtime files.
    user: "0:0"
    entrypoint: [/bin/sh, /bootstrap/runtime-init.sh]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./.secrets:/input:ro
      - ./infrastructure/runtime-init.sh:/bootstrap/runtime-init.sh:ro
      - runtime-secrets:/output
      - postgres-alpine-data:/pgdata
      - keyring:/keyring
      - logs-data:/logs-data

  postgres:
    image: strangler-fig-postgres:local
    build:
      context: .
      dockerfile: infrastructure/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: strangler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - postgres-alpine-data:/var/lib/postgresql
      - type: volume
        source: runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: postgres-alpine
      - ./database/001-init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username=postgres --dbname=strangler"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 64m
    mem_limit: 256m
    cpus: 0.75
    security_opt: [no-new-privileges:true]

  monolith:
    <<: *app
    image: strangler-fig-monolith:local
    build:
      context: .
      args:
        APP: Monolith
    environment:
      <<: *app-environment
      Database__Host: postgres
      Database__Name: strangler
      Database__Username: monolith_app
      Database__PasswordFile: /run/secrets/monolith_db_password
      Auth__AlexPasswordFile: /run/secrets/alex_password
      Auth__SamPasswordFile: /run/secrets/sam_password
      Auth__KeyRingPath: /app/keyring
      Auth__AllowInsecureHttp: "true"
    volumes:
      - type: volume
        source: runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: monolith
      - keyring:/app/keyring
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, dotnet, Monolith.dll, --healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  gateway:
    <<: *app
    image: strangler-fig-gateway:local
    build:
      context: .
      args:
        APP: Gateway
    environment:
      <<: *app-environment
      Monolith__Address: http://monolith:8080
    ports:
      - "127.0.0.1:${APP_PORT:-5190}:8080"
    volumes:
      - type: volume
        source: runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: gateway
    depends_on:
      monolith:
        condition: service_healthy
    healthcheck:
      test: [CMD, dotnet, Gateway.dll, --healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  db-viewer:
    image: strangler-fig-db-viewer:local
    build:
      context: .
      dockerfile: infrastructure/adminer.Dockerfile
    restart: unless-stopped
    user: "100:101"
    read_only: true
    ports:
      - "127.0.0.1:${DB_VIEWER_PORT:-5191}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: [CMD, php, -r, "$$response=file_get_contents('http://127.0.0.1:8080/'); exit($$response !== false && str_contains($$response, 'auth[password]') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    restart: unless-stopped
    user: "1654:1654"
    working_dir: /run/secrets
    read_only: true
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      ZO_MEMORY_CACHE_ENABLED: "false"
      ZO_MAX_FILE_SIZE_ON_DISK: "64"
      ZO_MAX_FILE_SIZE_IN_MEMORY: "16"
    ports:
      - "127.0.0.1:${LOGS_PORT:-5192}:5080"
    volumes:
      - logs-data:/data
      - type: volume
        source: runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: openobserve
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1

  sdk: &sdk
    image: strangler-fig-sdk:local
    build:
      context: .
      target: sdk
    profiles: [tools]
    working_dir: /workspace
    entrypoint: [dotnet]
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: /nuget/packages
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_NAME: strangler
      TEST_DATABASE_USERNAME: monolith_app
      TEST_DATABASE_PASSWORD_FILE: /run/secrets/monolith_db_password
    volumes:
      - .:/workspace
      - ./.local/nuget:/nuget
    tmpfs:
      - /workspace/.secrets:ro,mode=0555,noexec,nosuid,size=1m
    mem_limit: 2g
    cpus: 2

  tests:
    <<: *sdk
    volumes:
      - .:/workspace
      - ./.local/nuget:/nuget
      - type: volume
        source: runtime-secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: tests

volumes:
  # Retained original glibc database volume; never mount it into the musl image.
  postgres-data:
  postgres-alpine-data:
  runtime-secrets:
  keyring:
  # Preserved former viewer SQLite/settings for recovery; no active service mounts it.
  pgadmin-data:
  logs-data:
